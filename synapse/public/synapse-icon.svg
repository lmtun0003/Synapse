<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="50" cy="50" r="35" fill="url(#glow)"/>
  <!-- Grid nodes -->
  <circle cx="30" cy="30" r="6" fill="url(#signal)" opacity="0.9"/>
  <circle cx="50" cy="30" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="70" cy="30" r="6" fill="url(#signal)" opacity="0.7"/>
  <circle cx="30" cy="50" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="50" cy="50" r="8" fill="url(#signal)"/>
  <circle cx="70" cy="50" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="30" cy="70" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="50" cy="70" r="6" fill="url(#signal)" opacity="0.8"/>
  <circle cx="70" cy="70" r="5" fill="#ffffff" opacity="0.4"/>
  <!-- Connections -->
  <line x1="30" y1="30" x2="50" y2="30" stroke="url(#signal)" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="30" x2="70" y2="30" stroke="url(#signal)" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="30" x2="50" y2="50" stroke="url(#signal)" stroke-width="2.5" opacity="0.8"/>
  <line x1="30" y1="50" x2="50" y2="50" stroke="url(#signal)" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="50" x2="70" y2="50" stroke="url(#signal)" stroke-width="2.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="50" y2="70" stroke="url(#signal)" stroke-width="2.5" opacity="0.8"/>
  <line x1="30" y1="70" x2="50" y2="70" stroke="url(#signal)" stroke-width="2" opacity="0.4"/>
</svg>
